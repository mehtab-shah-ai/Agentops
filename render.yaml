services:
  # ----------------------------------------------------------------------------
  # Backend API & Observability Engine (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: agentops-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Dashboard UI (React 19 + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: agentops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agentops-backend
          property: host
