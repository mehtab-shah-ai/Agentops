version: '3.8'

services:
  agentguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/agentguard.db
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local
